<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <div class="logo">
        <img th:src="@{/img/logo.png}" alt="PMB-Scheduler Logo">
    </div>
    <nav>
        <ul>
            <li th:if="${roles.contains('ROLE_ADMIN')}"><a th:href="@{/create-event}" class="create-event">Create Event</a></li>
            <li><a th:href="@{/}" class="home">Home</a></li>
            <li><a th:href="@{/about}" class="about">About</a></li>
            <li><a th:href="@{/events}" class="events">Events</a></li>
            <!-- <li><a th:href="@{/My Profile}" class="login">My Profile</a></li> -->
            <li><a th:href="@{/login}" class="login">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="container">
        <div class="form-container">
            <form th:action="@{/create-event-post}" method="POST">
                <h2>Create Event</h2>

                <label for="date">Date</label>
                <input type="date" id="date" name="appointmentDate" required>
                <!-- style time field -->
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>

                <label for="location">Location</label>
                <input type="text" id="location" name="address" required>

                <label for="description">Description</label>
                <textarea id="description" name="description" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </div>
        <div th:if="${appointment != null}" class="event-container">
            <h2>Next Event</h2>
            <p><strong>Date:</strong> <span th:text="${appointment.appointmentDate}"></span></p>
            <p><strong>Location:</strong> <span th:text="${appointment.address}"></span></p>
            <p><strong>Description:</strong> <span th:text="${appointment.description}"></span></p>
            <h3>Registered Users</h3>
            <ul>
                <li>User 1</li>
                <li>User 2</li>
                <li>User 3</li>
            </ul>
        </div>
    </div>
</main>
<footer>
    <div class="footer-link">
        <a th:href="@{/imprint}">Imprint</a>
        <a th:href="@{/terms-of-use}">Terms of Use</a>
    </div>
</footer>
</body>
</html>
