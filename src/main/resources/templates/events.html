<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <div class="logo">
        <img th:src="@{/img/logo.png}" alt="PMB-Scheduler Logo">
    </div>
    <nav>
        <ul>
            <li><a th:href="@{/create-event}" class="create-event">Create Event</a></li>
            <li><a th:href="@{/index}">Home</a></li>
            <li><a th:href="@{/about}">About</a></li>
            <li><a th:href="@{/events}">Events</a></li>
            <li><a th:href="@{/login}" class="login">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="content-container">
        <h1>Events</h1>
        <table>
            <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Location</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appointment : ${appointments}">
                <td th:text="${appointment.name}">Event Name</td>
                <td th:text="${appointment.date}">Date</td>
                <td th:text="${appointment.location}">Location</td>
                <td th:text="${appointment.description}">Description</td>
                <td><button class="apply-button">Apply</button></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer>
    <div class="footer-link">
        <a th:href="@{/imprint.html}">Imprint</a>
        <a th:href="@{/terms-of-use.html}">Terms of Use</a>
    </div>
</footer>
</body>
</html>
