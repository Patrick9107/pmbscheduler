<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main>
    <div class="content-container">
        <h1>Events</h1>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Location</th>
                <th>Description</th>
                <th th:if="${roles.contains('ROLE_USER')}">Action</th>
                <th>Slots</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appointment,index : ${appointments}">
                <td th:text="${appointment.appointmentDate}">Date</td>
                <td th:text="${appointment.time}">Time</td>
                <td th:text="${appointment.address}">Location</td>
                <td th:text="${appointment.description}">Description</td>
                <form th:action="@{/apply-for-event}" method="post">
                    <td th:if="${roles.contains('ROLE_USER')}">
                        <button th:if="${!usersAppointments.contains(appointment.id)}" class="apply-button">Apply</button>
                        <div th:if="${usersAppointments.contains(appointment.id)}" class="applied-text">Applied</div>
                    </td>
                    <input type="hidden" name="id" th:value="${appointment.id}">
                </form>
                <td>
                    <div class="slots" th:classappend="${personSumForAppointment[__${index.index}__] == appointment.availableSpots ? 'full' : ''}">
                        <span th:text="${personSumForAppointment[__${index.index}__]} + '/' + ${appointment.availableSpots}"></span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
