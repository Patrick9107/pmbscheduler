<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <div class="logo">
        <img th:src="@{/img/logo.png}" alt="PMB-Scheduler Logo">
    </div>
    <nav>
        <ul>
            <li th:if="${roles != null}">
                <a th:href="@{/create-event}" class="create-event">Create Event</a>
            </li>
            <li><a th:href="@{/}" class="home">Home</a></li>
            <li><a th:href="@{/about}" class="about">About</a></li>
            <li><a th:href="@{/events}" class="events">Events</a></li>
            <!-- <li><a th:href="@{/My Profile}" class="login">My Profile</a></li> -->
            <li><a th:href="@{/login}" class="login">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="search-section">
        <input type="text" id="search-input" placeholder="Search">
        <button type="submit" id="search-button"><img th:src="@{/img/loop-search.png}" alt="Search"></button>
    </div>
    <div class="image-section">
        <img th:src="@{/img/img-index.png}" alt="Placeholder" height="500rem" width="1250rem">
    </div>
</main>
<footer>
    <div class="footer-link">
        <a th:href="@{/imprint}">Imprint</a>
        <a th:href="@{/terms-of-use}">Terms of Use</a>
    </div>
</footer>
</body>
</html>
