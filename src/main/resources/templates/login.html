<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <div class="logo">
        <img th:src="@{/img/logo.png}" alt="PMB-Scheduler Logo">
    </div>
    <nav>
        <ul>
            <li th:if="${roles.contains('ADMIN')}"> <a th:href="@{/create-event}" class="create-event">Create Event</a></li>
            <li><a th:href="@{/}" class="home">Home</a></li>
            <li><a th:href="@{/about}" class="about">About</a></li>
            <li><a th:href="@{/events}" class="events">Events</a></li>
            <li><a th:href="@{/login}" class="login">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="form-container">
        <form action="/auth/login" method="POST" th:object="${person}">
            <h2>Login</h2>
<!--            <label for="first-name">First Name</label>-->
<!--            <input type="text" id="first-name" name="firstName" required>-->

<!--            <label for="last-name">Last Name</label>-->
<!--            <input type="text" id="last-name" name="lastName" required>-->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <div class="register-link">
            <p>Not registered yet?</p>
            <a th:href="@{/register}" class="register-button">Register Here</a>
        </div>
    </div>
</main>
<footer>
    <div class="footer-link">
        <a th:href="@{/imprint}">Imprint</a>
        <a th:href="@{/terms-of-use}">Terms of Use</a>
    </div>
</footer>
</body>
</html>
