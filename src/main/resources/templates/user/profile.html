<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main>
    <div th:if="${person != null}" class="profile-container">
        <h2>Profile</h2>
        <form th:action="@{/auth/update-profile}" method="POST" th:object="${person}">
            <div class="profile-info">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="firstName" th:value="${person.firstName}" required>
            </div>

            <div class="profile-info">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="lastName" th:value="${person.lastName}" required>
            </div>

            <div class="profile-info">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" th:value="${person.email}" required>
            </div>

            <button type="submit">Update Profile</button>

            <div th:if="${error}" th:text="'Error: ' + ${error}" class="error-message"></div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
