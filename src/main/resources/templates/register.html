<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PMB-Scheduler</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <div class="logo">
        <img th:src="@{/img/logo.png}" alt="PMB-Scheduler Logo">
    </div>
    <nav>
        <ul>
            <li th:if="${roles != null}"> <a th:href="@{/create-event}" class="create-event">Create Event</a></li>
            <li><a th:href="@{/}" class="home">Home</a></li>
            <li><a th:href="@{/about}" class="about">About</a></li>
            <li><a th:href="@{/events}" class="events">Events</a></li>
            <!-- <li><a th:href="@{/My Profile}" class="login">My Profile</a></li> -->
            <li><a th:href="@{/login}" class="login">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="form-container">
        <form th:action="@{/auth/register}" method="POST" th:object="${person}">
            <h2>Register</h2>
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="firstName" required>

            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="lastName" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Register</button>

            <div id="error" th:if="${error}" th:text="'Error: ' + ${error}"></div>
        </form>
    </div>
</main>
<footer>
    <div class="footer-link">
        <a th:href="@{/imprint}">Imprint</a>
        <a th:href="@{/terms-of-use}">Terms of Use</a>
    </div>
</footer>
</body>
</html>
